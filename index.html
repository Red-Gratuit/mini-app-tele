<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XRshop</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <audio id="bgMusic" src="music.mp3" loop></audio>

  <main class="app">
    <div class="blur-bg"></div>

    <!-- INTRO -->
    <section class="intro screen active" id="intro">
      <h1 class="logo-glow">XRshop</h1>
      <button id="startBtn" class="cta">Choisir sa puff</button>
    </section>

    <!-- CONTENU -->
    <section class="card screen" id="content">
      <h2 class="glow">XR SHOP</h2>

      <div class="cards">
        <div class="img-block">
          <div class="img-card">
            <img src="image1.jpg" />
          </div>
          <p class="price">16K JNR — 10€</p>
        </div>

        <div class="img-block">
          <div class="img-card">
            <img src="image2.jpg" />
          </div>
          <p class="price">18K JNR — 10€</p>
        </div>
      </div>

      <button id="snapBtn">👻 Ajouter sur Snapchat</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
