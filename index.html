<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XRshop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="bgMusic" src="music.mp3" loop></audio>

<!-- INTRO -->
<section id="intro" class="screen active">
  <div class="bg"></div>
  <h1 class="logo">XRshop</h1>
  <button id="enterBtn" class="enter-btn">Choisir sa puff</button>
</section>

<!-- APP -->
<section id="app" class="screen">

<header class="header">XRshop</header>

<!-- CATEGORIES -->
<div class="categories">
  <button class="cat active" data-view="puffs">💨 PUFFS</button>
  <button class="cat" data-view="stup">🌿 STUP</button>
  <button class="cat" data-view="tabac">🚬 TABAC</button>
</div>

<main class="content">

<!-- PUFFS -->
<section class="view active" id="view-puffs">
  <div class="grid">

    <div class="card">
      <video src="video1.mp4" autoplay muted loop playsinline></video>
      <h3>16K JNR</h3>
      <p>10€</p>
      <button class="snap-btn">👻 Snapchat</button>
    </div>

    <div class="card">
      <video src="video2.mp4" autoplay muted loop playsinline></video>
      <h3>18K JNR</h3>
      <p>10€</p>
      <button class="snap-btn">👻 Snapchat</button>
    </div>

  </div>

  <div class="slogan">
    Le vrai goût des bonnes choses 😋🔥
  </div>
</section>

<!-- STUP -->
<section class="view" id="view-stup">
  <h2>🌿 STUP</h2>
  <p>À venir…</p>
</section>

<!-- TABAC -->
<section class="view" id="view-tabac">
  <h2>🚬 TABAC</h2>
  <p>À venir…</p>
</section>

</main>

<nav class="bottom">
  <button id="muteBtn">🔊</button>
</nav>

<script src="app.js"></script>
</section>

</body>
</html>
