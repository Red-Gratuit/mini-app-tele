<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XR Shop</title>

  <!-- Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- 🎵 Musique -->
  <audio id="bgMusic" src="music.mp3" loop></audio>

  <main class="app">
    <div class="overlay"></div>

    <!-- ÉCRAN ACCUEIL -->
    <section class="card screen active" id="home">
      <div class="logo">🚀</div>
      <h1>XR Shop</h1>
      <p id="status" class="status">Connexion…</p>

      <button id="enterBtn">Entrer</button>
    </section>

    <!-- ÉCRAN MENU -->
    <section class="card screen" id="menu">
      <h2>🛒 Menu</h2>

      <div class="item">🔥 Produit 1</div>
      <div class="item">💎 Produit 2</div>
      <div class="item">⚡ Produit 3</div>

      <button id="muteBtn">🔇 Muet</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
