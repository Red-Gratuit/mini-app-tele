<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XRshop</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <audio id="bgMusic" src="music.mp3" loop></audio>

  <!-- FOND FLOU -->
  <div class="background"></div>

  <!-- INTRO -->
  <section class="screen active" id="intro">
    <h1 class="logo">XRshop</h1>
    <button id="startBtn" class="primary-btn">Choisir sa puff</button>
  </section>

  <!-- PRODUITS -->
  <section class="screen" id="products">
    <div class="cards">
      <div class="product">
        <img src="image1.jpg" />
        <p>16K JNR 10€</p>
      </div>

      <div class="product">
        <img src="image2.jpg" />
        <p>18K JNR 10€</p>
      </div>
    </div>

    <button id="snapBtn" class="snap-btn">Ajouter sur Snapchat</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
