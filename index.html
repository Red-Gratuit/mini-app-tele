<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XRshop</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <audio id="bgMusic" src="music.mp3" loop></audio>

  <div class="blur-bg"></div>

  <!-- INTRO -->
  <section class="intro screen active" id="intro">
    <h1 class="xr-logo">XRshop</h1>
    <button id="startBtn" class="start-btn">Choisir sa puff</button>
  </section>

  <!-- CONTENU -->
  <section class="content screen" id="content">
    <div class="cards">
      <div class="card">
        <img src="image1.jpg" />
        <span>16K JNR 10€</span>
      </div>

      <div class="card">
        <img src="image2.jpg" />
        <span>18K JNR 10€</span>
      </div>
    </div>

    <button id="snapBtn" class="snap-btn">Ajouter sur Snapchat</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
