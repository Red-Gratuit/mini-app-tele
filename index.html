<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XRshop</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="bgMusic" src="music.mp3" loop></audio>

<!-- INTRO -->
<section id="intro" class="screen active">
  <div class="bg"></div>
  <h1 class="logo">XRshop</h1>
  <button id="enterBtn" class="enter-btn">Entrée</button>
</section>

<!-- APP -->
<section id="app" class="screen">
  <header class="header">XRshop</header>

  <main class="content">

    <!-- PUFFS -->
    <section id="puffs" class="page active">
      <div class="grid">

        <div class="card">
          <img src="image1.jpg">
          <h3>16K JNR</h3>
          <p>10€</p>
          <button class="snap-btn">👻 Snapchat</button>
        </div>

        <div class="card">
          <img src="image2.jpg">
          <h3>18K JNR</h3>
          <p>10€</p>
          <button class="snap-btn">👻 Snapchat</button>
        </div>

      </div>

      <div class="slogan">
        Le vrai goût des bonnes choses 😋🔥
      </div>
    </section>

    <!-- INFOS -->
    <section id="infos" class="page">
      <h2>XRshop</h2>
      <p>Commandes sécurisées 24/7</p>
      <p>Livraison rapide</p>
      <button class="snap-btn big">👻 Snapchat</button>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="page">
      <h2>Contact</h2>
      <button class="snap-btn big">👻 Snapchat</button>
    </section>

  </main>

  <!-- BARRE DU BAS -->
  <nav class="bottom">
    <button data-page="puffs">🛒</button>
    <button data-page="infos">ℹ️</button>
    <button data-page="contact">📞</button>
    <button id="muteBtn">🔊</button>
  </nav>
</section>

<script src="app.js"></script>
</body>
</html>
