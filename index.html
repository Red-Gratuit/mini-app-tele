<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XRshop</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <audio id="bgMusic" src="music.mp3" loop></audio>

  <!-- HEADER -->
  <header class="header">
    <h1>XRshop</h1>
  </header>

  <!-- CONTENT -->
  <main class="content">

    <!-- PUFFS -->
    <section class="page active" id="puffs">
      <div class="grid">
        <div class="product">
          <img src="image1.jpg">
          <span class="stock">EN STOCK</span>
          <h3>16K JNR</h3>
          <p>10€</p>
        </div>

        <div class="product">
          <img src="image2.jpg">
          <span class="stock">EN STOCK</span>
          <h3>18K JNR</h3>
          <p>10€</p>
        </div>
      </div>
    </section>

    <!-- INFOS -->
    <section class="page" id="infos">
      <h2>ℹ️ Infos</h2>
      <p>Commandes sécurisées 24/7</p>
      <p>Livraison rapide</p>
    </section>

    <!-- CONTACT -->
    <section class="page" id="contact">
      <h2>📩 Contact</h2>
      <button id="snapBtn">Ajouter sur Snapchat</button>
    </section>

  </main>

  <!-- BOTTOM BAR -->
  <nav class="bottom-bar">
    <button data-page="puffs">🛒</button>
    <button data-page="infos">ℹ️</button>
    <button data-page="contact">📞</button>
    <button id="muteBtn">🔊</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
