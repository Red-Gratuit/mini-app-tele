<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>XRshop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Fond flyer -->
<div class="bg"></div>

<header>
  <h1>XRshop</h1>
</header>

<!-- Catégories -->
<div class="categories">
  <button class="cat active" data-view="view-puffs">💨 PUFFS</button>
  <button class="cat" data-view="view-stup">🌿 STUP</button>
  <button class="cat" data-view="view-tabac">🚬 TABAC</button>
</div>

<main>

<!-- PUFFS -->
<section class="view active" id="view-puffs">
  <div class="grid">

    <div class="card">
      <video src="video1.mp4" autoplay muted loop playsinline></video>
      <h3>16K JNR</h3>
      <p>10€</p>
      <button onclick="openSnap()">👻 Snapchat</button>
    </div>

    <div class="card">
      <video src="video2.mp4" autoplay muted loop playsinline></video>
      <h3>18K JNR</h3>
      <p>10€</p>
      <button onclick="openSnap()">👻 Snapchat</button>
    </div>

  </div>

  <p class="slogan">Le vrai goût des bonnes choses 😋🔥</p>
</section>

<!-- STUP -->
<section class="view" id="view-stup">
  <h2>🌿 STUP</h2>
  <p>À venir…</p>
</section>

<!-- TABAC -->
<section class="view" id="view-tabac">
  <h2>🚬 TABAC</h2>
  <p>À venir…</p>
</section>

</main>

<script src="app.js"></script>
</body>
</html>
