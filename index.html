<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XRshop</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="bgMusic" src="music.mp3" loop></audio>

<!-- INTRO -->
<section id="intro" class="screen active">
  <div class="bg"></div>
  <h1 class="logo">XRshop</h1>
  <button id="enterBtn" class="enter-btn">Entrée</button>
</section>

<!-- APP -->
<section id="app" class="screen">
  <header class="header">XRshop</header>

  <main class="content">

    <!-- PRODUITS -->
    <section class="products">
      <div class="grid">

        <div class="card">
          <img src="image1.jpg">
          <h3>16K JNR</h3>
          <p>10€</p>
          <button class="snap-btn">👻 Snapchat</button>
        </div>

        <div class="card">
          <img src="image2.jpg">
          <h3>18K JNR</h3>
          <p>10€</p>
          <button class="snap-btn">👻 Snapchat</button>
        </div>

      </div>

      <!-- TEXTE EN BAS -->
      <div class="slogan">
        Le vrai goût des bonnes choses 😋🔥
      </div>
    </section>

  </main>

  <!-- BARRE DU BAS -->
  <nav class="bottom">
    <button>🛒</button>
    <button>ℹ️</button>
    <button>📞</button>
    <button id="muteBtn">🔊</button>
  </nav>
</section>

<script src="app.js"></script>
</body>
</html>
