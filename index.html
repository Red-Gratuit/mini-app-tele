<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XR Shop</title>

  <!-- Telegram SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- 🎵 Musique -->
  <audio id="bgMusic" src="music.mp3" loop></audio>

  <main class="app">
    <div class="overlay"></div>

    <!-- ÉCRAN ACCUEIL -->
    <section class="card screen active" id="home">
      <div class="logo">🚀</div>
      <h1>XR Shop</h1>
      <button id="enterBtn">Entrer</button>
    </section>

    <!-- ÉCRAN CONTENU -->
    <section class="card screen" id="content">
      <h2>🔥 Découvre-nous</h2>

      <div class="cards">
        <div class="img-card">
          <img src="image1.jpg" alt="Image 1" />
        </div>

        <div class="img-card">
          <img src="image2.jpg" alt="Image 2" />
        </div>
      </div>

      <button id="snapBtn">👻 Mon Snapchat</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
